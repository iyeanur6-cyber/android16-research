name: Android 16 Core Research Lab
on: [push]
jobs:
  build-and-reverse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Compilers and Strace
        run: sudo apt update && sudo apt install -y build-essential strace
        
      - name: Compile Security Code
        run: gcc x.c -o x_binary
        
      - name: Execute Disassembly
        run: objdump -d x_binary > disassembly_output.txt
        
      - name: Archive Research Logs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-leak-logs
          path: disassembly_output.txt
          
