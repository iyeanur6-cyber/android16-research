name: Android Security Research Decompiler
on: [push]
jobs:
  decompile-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Analysis Tools
        run: sudo apt update && sudo apt install -y build-essential binutils

      - name: Compile Target Binary
        run: gcc x.c -o target_binary

      - name: Generate Detailed Logic Analysis
        run: |
          # Detailed Disassembly with source-line intermix (if available)
          objdump -d -M intel -S target_binary > full_logic_analysis.txt
          # Extracting only the main function logic
          objdump -d target_binary | sed -n '/<main>:/,/^$/p' > main_function_decompiled.txt

      - name: Archive Research Logs
        uses: actions/upload-artifact@v4
        with:
          name: research-decompiled-files
          path: |
            full_logic_analysis.txt
            main_function_decompiled.txt
            
